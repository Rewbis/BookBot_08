      phase_a:   claude-sonnet-5
      phase_b:   "—"
      phase_c1:  "—"
      phase_c2:  "—"
      phase_c3a: "—"
      phase_c3b: "—"

    - agent: Antagonist
      phase_a:   claude-sonnet-5
      phase_b:   "—"
      phase_c1:  "—"
      phase_c2:  "—"
      phase_c3a: "—"
      phase_c3b: "—"

    - agent: "Plotter Revision"
      phase_a:   claude-sonnet-5
      phase_b:   "—"
      phase_c1:  "—"
      phase_c2:  "—"
      phase_c3a: "—"
      phase_c3b: "—"

    - agent: "Continuity Agent"
      phase_a:   claude-sonnet-5
      phase_b:   "—"
      phase_c1:  "—"
      phase_c2:  "—"
      phase_c3a: "—"
      phase_c3b: "—"

